name: Release

# A tag v<version> releases the plugin: it must match the manifest's version. The job runs in the `release`
# environment, which holds NKEEPER_RELEASE_KEY (the official key's private half, as a PEM) and needs an
# owner's approval for each run (docs/architecture.md §9 in NKeeper).
on:
  push:
    tags: ['v*']

# Least privilege: the job reads GitHub Packages, and writes only the release it publishes.
permissions:
  contents: write
  packages: read

# Never two releases at once, and never cancel one that has started signing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag, build and test
    runs-on: [self-hosted, nkeeper]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      id: ${{ steps.version.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    env:
      # nuget.config reads these. The workflow's own token is enough to restore from GitHub Packages.
      NUGET_USERNAME: ${{ github.actor }}
      NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag and the manifest must agree. The tag is untrusted input, so it reaches the script through the
      # environment, and only a plain version is accepted.
      - name: Check the tag against the manifest
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "The tag '$TAG' isn't of the form v<version>." >&2
            exit 1
          fi
          manifest_version=$(jq -er '.version' backend/nkeeper-plugin.json)
          manifest_id=$(jq -er '.id' backend/nkeeper-plugin.json)
          if [ "${BASH_REMATCH[1]}" != "$manifest_version" ]; then
            echo "The tag $TAG doesn't match the manifest's version $manifest_version." >&2
            exit 1
          fi
          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"
          echo "id=$manifest_id" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore NKeeper.Plugin.WakeOnLan.slnx --locked-mode

      # Building packs the plugin with a development key made for this run. Only the tests use that package.
      # The release key isn't available to this step, nor to any code that runs before the signing step.
      - name: Build
        run: dotnet build NKeeper.Plugin.WakeOnLan.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test NKeeper.Plugin.WakeOnLan.slnx --no-build --configuration Release

  release:
    name: Sign and publish
    needs: verify
    # Signing runs on the single-use runner, reset after every job, so nothing an earlier job left behind can
    # reach the key.
    runs-on: nkeeper-clean
    timeout-minutes: 30
    environment: release
    env:
      NUGET_USERNAME: ${{ github.actor }}
      NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore backend/NKeeper.Plugins.WakeOnLan.csproj --locked-mode

      # The only step that sees the key. It's written to memory-backed storage, readable by this user only, for
      # the length of the build, and removed when the step ends however it ends. The variable is dropped from the
      # environment as soon as the file exists, so nothing the build starts inherits it. Nothing here prints it.
      - name: Pack and sign with the official key
        env:
          NKEEPER_RELEASE_KEY: ${{ secrets.NKEEPER_RELEASE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_dir=$(mktemp -d /dev/shm/nkeeper-release-key.XXXXXX)
          trap 'rm -rf "$key_dir"; dotnet build-server shutdown >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$NKEEPER_RELEASE_KEY" > "$key_dir/release.pem"
          unset NKEEPER_RELEASE_KEY
          dotnet build backend/NKeeper.Plugins.WakeOnLan.csproj --no-restore --configuration Release \
            --disable-build-servers \
            -p:NKeeperSigningKey="$key_dir/release.pem" \
            -p:NKeeperPluginPackages="$PWD/release/"

      - name: Remove any key left behind
        if: always()
        run: rm -rf /dev/shm/nkeeper-release-key.*

      - name: Checksum
        id: package
        env:
          ID: ${{ needs.verify.outputs.id }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          cd release
          package="$ID-$VERSION.nkp"
          if [ "$(ls -A . | wc -l)" -ne 1 ] || [ ! -f "$package" ]; then
            echo "Expected exactly $package in release/, found: $(ls -A .)" >&2
            exit 1
          fi
          sha256sum "$package" > "$package.sha256"
          echo "name=$package" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$package.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.name }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "release/$PACKAGE" "release/$PACKAGE.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Wake-on-LAN $VERSION" "${flags[@]}" \
            --notes "$(printf 'Wake-on-LAN %s, signed with the official NKeeper plugin key.\n\nSHA-256 of `%s`:\n\n`%s`\n' "$VERSION" "$PACKAGE" "$SHA256")"
